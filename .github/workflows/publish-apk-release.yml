name: Publish Glass TV Home APK Release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write

jobs:
  publish-validated-apk:
    if: github.event.pull_request.number == 79
    name: Publish exact CI-validated APK as direct release asset
    runs-on: ubuntu-latest
    steps:
      - name: Download exact APK artifact from CI #1545
        uses: actions/download-artifact@v4
        with:
          name: glass-tv-home-dock-visual-parity-5036c61e785b1b457b90954c3baa3e72b181cd06
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42479472690
          path: downloaded-apk

      - name: Verify exact APK artifact
        run: |
          test -f downloaded-apk/app-release.apk
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile

          path = "downloaded-apk/app-release.apk"
          expected_size = 1624589
          expected_sha256 = "6c7981a6c71aa5fc6f5146ba5a6023b9fdbfc527c887d1c367dc500d04fd3b10"
          actual_size = os.path.getsize(path)
          with open(path, "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          assert actual_size == expected_size, f"Unexpected APK size: {actual_size}"
          assert digest == expected_sha256, f"Unexpected APK SHA-256: {digest}"
          assert zipfile.is_zipfile(path), "APK is not a valid ZIP-based Android package"
          print(f"Verified exact CI #1545 APK: {path}")
          print(f"Size: {actual_size}")
          print(f"SHA-256: {digest}")
          PY

      - name: Publish direct .apk release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-tv-home-ci1545-20261108
          target_commitish: c058935ed4398f5c7964d753fcf35a9cf77989bb
          name: Glass TV Home — CI #1545 QA APK
          body: |
            Exact APK artifact from CI #1545, not a rebuild.
            Validated source/test commit: c058935ed4398f5c7964d753fcf35a9cf77989bb.
            Device installation and physical Mi TV Stick acceptance remain pending.
          prerelease: true
          files: downloaded-apk/app-release.apk
