name: Publish Glass TV Home APK Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-direct-apk:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 79
    name: Build exact PR HEAD and publish direct APK asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify direct APK output
        run: |
          test -f launcher/app/build/outputs/apk/release/app-release.apk
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile

          path = "launcher/app/build/outputs/apk/release/app-release.apk"
          assert zipfile.is_zipfile(path), "Build output is not a valid APK package"
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              assert "AndroidManifest.xml" in names, "APK manifest is missing"
          with open(path, "rb") as stream:
              digest = hashlib.sha256(stream.read()).hexdigest()
          print(f"APK file: {path}")
          print(f"Size: {os.path.getsize(path)} bytes")
          print(f"SHA-256: {digest}")
          PY

      - name: Publish direct .apk release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-tv-home-pr79-${{ github.event.pull_request.head.sha || github.sha }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Glass TV Home — PR #79 QA APK
          body: |
            Release APK built from the exact PR #79 source HEAD shown in this release tag.
            Unit tests and assembleRelease are run in this workflow.
            The downloadable asset is the APK itself; no ZIP/BIN is distributed.
            Physical Mi TV Stick acceptance remains pending until owner testing.
          prerelease: true
          files: launcher/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true


# Trigger note: PR #79 must run the publisher defined on its base branch; see base-branch workflow correction.
