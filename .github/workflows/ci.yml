name: CI

on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build (validation only)
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: APK size diagnostics (read-only)
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          apk = "launcher/app/build/outputs/apk/release/app-release.apk"
          print(f"APK exact size: {os.path.getsize(apk)} bytes")
          with zipfile.ZipFile(apk) as archive:
              entries = sorted(
                  ((item.file_size, item.compress_size, item.filename)
                   for item in archive.infolist() if not item.is_dir()),
                  reverse=True,
              )
              print("Largest packaged entries (uncompressed / compressed / path):")
              for raw, packed, name in entries[:30]:
                  print(f"{raw:>9} / {packed:>9} / {name}")
              print(f"Total uncompressed entries: {sum(x[0] for x in entries)} bytes")
              print(f"Total compressed entries:   {sum(x[1] for x in entries)} bytes")
          PY
      - name: Report release APK size (non-blocking diagnostic)
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          echo "release APK exact size: $size bytes"
          # Size is monitored for transparency, not used as a quality gate.
          # UI quality, accessibility, stability and test results take priority.
          if [ "$size" -ge 1572864 ]; then
            echo "::warning::Release APK is above the historical 1.5 MiB reference; review the size delta, but do not block CI."
          fi
      - name: Publish Home layout test APK (PR #74/#75/#76/#77/#79/#80)
        if: github.event_name == 'pull_request' && (github.event.pull_request.number == 74 || github.event.pull_request.number == 75 || github.event.pull_request.number == 76 || github.event.pull_request.number == 77 || github.event.pull_request.number == 79 || github.event.pull_request.number == 80 || github.event.pull_request.number == 81 || github.event.pull_request.number == 82)
        uses: actions/upload-artifact@v4
        with:
          name: glass-tv-home-dock-visual-parity-${{ github.sha }}
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
