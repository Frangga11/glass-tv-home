name: CI

on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build (validation only; retry transient repository failures)
        working-directory: launcher
        run: |
          set -o pipefail
          chmod +x gradlew
          log_file="$RUNNER_TEMP/gradle-build-attempt-1.log"
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee "$log_file"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi
          if ! grep -Eq 'Could not (find|resolve)|Could not parse POM|Could not GET|Could not HEAD|Temporary failure in name resolution|UnknownHostException|Connection timed out|Read timed out|502 Bad Gateway|503 Service Unavailable|429 Too Many Requests' "$log_file"; then
            echo "Build failed for a reason outside the targeted dependency/network retry; preserving the original failure."
            exit "$build_status"
          fi
          echo "Transient dependency/repository resolution failure detected. Retrying the complete test and release build once with dependency metadata refresh."
          ./gradlew --no-daemon --refresh-dependencies testReleaseUnitTest assembleRelease
      - name: APK size diagnostics (read-only; no artifact publication)
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          apk = "launcher/app/build/outputs/apk/release/app-release.apk"
          print(f"APK exact size: {os.path.getsize(apk)} bytes")
          with zipfile.ZipFile(apk) as archive:
              entries = sorted(
                  ((item.file_size, item.compress_size, item.filename)
                   for item in archive.infolist() if not item.is_dir()),
                  reverse=True,
              )
              print("Largest packaged entries (uncompressed / compressed / path):")
              for raw, packed, name in entries[:30]:
                  print(f"{raw:>9} / {packed:>9} / {name}")
              print(f"Total uncompressed entries: {sum(x[0] for x in entries)} bytes")
              print(f"Total compressed entries:   {sum(x[1] for x in entries)} bytes")
          PY
      - name: Enforce release APK size budget (validation only)
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          # The bundled Default wallpaper adds an intentional ~226 KiB JPEG asset.
          # Keep the complete release APK below 1.5 MiB while retaining headroom.
          test "$size" -lt 1572864 || { echo "APK exceeds the 1.5 MiB budget"; exit 1; }

      - name: Upload final TV-test APK artifact (G02 build only)
        uses: actions/upload-artifact@v4
        with:
          name: glass-tv-home-final-562cde0
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
